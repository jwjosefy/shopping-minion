# One model per role (ADR-0009). Swapping a model or provider is a change here plus an API key
# in .env. Providers use LangChain's init_chat_model names.

intake:
  provider: google_genai # free-tier key for small tests (GOOGLE_API_KEY in .env)
  model: gemini-3.5-flash # 3.8-flash returned 503 "high demand" on 2026-09-29
  max_tokens: 16000
  # provider: anthropic
  # model: claude-sonnet-5-5 # alternative: claude-haiku-4-5

resolver:
  backend: haiku # haiku | julia1 | jev (ADR-0010; default chosen by evals)
  model: claude-haiku-4-5 # only used by LLM backends

discovery:
  provider: openai # OpenRouter's OpenAI-compatible API
  model: z-ai/glm-5.3-flash
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  # Gemini free tier (20 requests/day/model) wasn't enough for a full run:
  # provider: google_genai
  # model: gemini-3.5-flash
  # Planned default (ADR-0009):
  # provider: anthropic
  # model: claude-opus-5-5
  # max_tokens: 16000

# fallback: reserved, not configured in v0 (ADR-0009)
