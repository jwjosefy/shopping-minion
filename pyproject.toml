[project]
name = "shopping-minion"
version = "0.0.1"
description = "An agent that turns a handwritten grocery list into a ready-to-review online shopping cart."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Johann Josefy", email = "jwjosefy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
