[project]
name = "shopping-minion"
version = "0.0.1"
description = "An agent that turns a handwritten grocery list into a ready-to-review online shopping cart."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Johann Josefy", email = "jwjosefy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
shopping-minion = "shopping_minion.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits real external sites; run explicitly with `uv run pytest -m live`",
]
