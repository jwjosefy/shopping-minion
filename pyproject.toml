[project]
name = "shopping-minion"
version = "0.1.0"
description = "Turns a photo of a handwritten grocery list into a cart at andorinhaonline.com.br"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "playwright",
    "typesafe-sdk",
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
shopping-minion = "shopping_minion.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_minion"]

[tool.ruff]
line-length = 100
extend-exclude = ["alfa0", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: opens the real site or calls a paid model; deselected by default",
]
